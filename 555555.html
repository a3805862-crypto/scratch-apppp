<!-- ================= 籤紙系統升級版（直接覆蓋原本 ticket CSS + JS） ================= -->

<style>

/* ================= 籤紙 ================= */

#ticketWrap{

    width:92%;
    max-width:760px;

    position:relative;
}

/* 整張票 */

#ticket{

    width:100%;

    aspect-ratio:7/3;

    position:relative;

    overflow:visible;

    perspective:1800px;
}

/* ================= 內層 ================= */

#ticketBase{

    position:absolute;
    inset:0;

    background:var(--innerColor,#dff3ff);

    border:3px solid #111;

    border-radius:28px;

    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:58px;
    font-weight:bold;

    color:#111;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.15);
}

/* 內層裝飾 */

#ticketBase::before{

    content:"";

    position:absolute;

    inset:14px;

    border:2px dashed rgba(0,0,0,0.2);

    border-radius:18px;
}

/* ================= 可撕層 ================= */

#ticketTop{

    position:absolute;

    width:93%;
    height:78%;

    left:3.5%;
    top:11%;

    background:var(--outerColor,#2f7ea7);

    border:2px solid #111;

    border-radius:22px;

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;

    font-size:40px;
    font-weight:bold;

    cursor:pointer;

    z-index:5;

    overflow:hidden;

    transform-style:preserve-3d;

    transition:
        transform 1s cubic-bezier(.2,.85,.1,1),
        opacity 0.7s;
}

/* 光澤 */

#ticketTop::before{

    content:"";

    position:absolute;

    left:-50%;
    top:0;

    width:40%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.35),
            transparent
        );

    transform:skewX(-20deg);

    animation:shine 2.8s infinite;
}

@keyframes shine{

    100%{
        left:160%;
    }
}

/* 撕紙皺摺 */

#ticketTop::after{

    content:"";

    position:absolute;

    right:-20px;
    top:0;

    width:50px;
    height:100%;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,0.35),
            rgba(0,0,0,0.12)
        );

    opacity:0;

    transition:0.4s;
}

/* ================= 真實撕開 ================= */

.tearing{

    box-shadow:
        -25px 15px 30px rgba(0,0,0,0.28),
        inset -10px 0 12px rgba(255,255,255,0.25);

    filter:brightness(1.05);
}

.tearing::after{

    opacity:1;
}

.opened{

    animation:realTear 1s forwards;
}

@keyframes realTear{

    0%{

        transform:
            rotate(0deg)
            translate(0,0)
            scale(1);
    }

    18%{

        transform:
            rotate(-5deg)
            translate(-3%,-1%)
            scale(1.01);
    }

    35%{

        transform:
            rotate(-10deg)
            translate(-8%,-2%)
            scale(1);
    }

    55%{

        transform:
            rotate(-18deg)
            translate(-30%,-5%)
            scale(0.99)
            rotateY(12deg);
    }

    78%{

        transform:
            rotate(-26deg)
            translate(-70%,-15%)
            scale(0.96)
            rotateY(42deg);
    }

    100%{

        transform:
            rotate(-38deg)
            translate(-140%,-28%)
            scale(0.9)
            rotateY(78deg);

        opacity:0;
    }
}

/* ================= 確認按鈕 ================= */

#confirmBtn{

    width:100%;

    margin-top:22px;

    border:none;

    background:#111;

    color:white;

    padding:18px;

    border-radius:18px;

    font-size:24px;

    cursor:pointer;

    transition:0.2s;
}

#confirmBtn:active{

    transform:scale(0.98);
}

/* ================= 顏色設定 ================= */

.colorFlex{

    display:flex;
    gap:16px;
    margin-top:12px;
}

.colorBox{

    flex:1;
}

.colorBox label{

    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

/* ================= 手機 ================= */

@media(max-width:700px){

    #ticketBase{

        font-size:42px;
    }

    #ticketTop{

        font-size:28px;
    }
}

</style>

<!-- ================= 設定頁新增（放進 settingContent 裡面） ================= -->

<div class="block">

    <h3>籤紙顏色設定</h3>

    <div class="colorFlex">

        <div class="colorBox">

            <label>
                外層可撕紙
            </label>

            <input type="color"
                   id="outerColor"
                   value="#2f7ea7">

        </div>

        <div class="colorBox">

            <label>
                內層紙張
            </label>

            <input type="color"
                   id="innerColor"
                   value="#dff3ff">

        </div>

    </div>

</div>

<script>

/* ================= 顏色變數 ================= */

document.documentElement.style.setProperty(
    "--outerColor",
    "#2f7ea7"
);

document.documentElement.style.setProperty(
    "--innerColor",
    "#dff3ff"
);

/* ================= 開啟票券 ================= */

function openTicket(num){

    const data = pages[currentPage];

    if(data.opened.includes(num)) return;

    currentNumber = num;

    popup.style.display = "flex";

    ticketTop.classList.remove(
        "opened",
        "tearing"
    );

    ticketTop.style.opacity = 1;

    ticketTop.style.transform =
        "rotate(0deg)";

    ticketBase.innerText =
        data.rewards[num] || "銘謝惠顧";
}

/* ================= 真實撕開 ================= */

let tearing = false;

ticketTop.addEventListener(
    "pointerdown",
    function(e){

    if(tearing) return;

    tearing = true;

    const rect =
    ticketTop.getBoundingClientRect();

    const x =
    e.clientX - rect.left;

    const y =
    e.clientY - rect.top;

    /* 撕開點 */

    ticketTop.style.transformOrigin =
        `${x}px ${y}px`;

    /* 隨觸碰偏移 */

    const offsetX =
        (x / rect.width - 0.5) * 20;

    const offsetY =
        (y / rect.height - 0.5) * 10;

    ticketTop.style.transform =
        `translate(${offsetX}px,${offsetY}px)`;

    /* 捲曲 */

    ticketTop.classList.add(
        "tearing"
    );

    setTimeout(()=>{

        ticketTop.classList.add(
            "opened"
        );

    },80);

    /* 已抽紀錄 */

    const data =
    pages[currentPage];

    if(!data.opened.includes(currentNumber)){

        data.opened.push(currentNumber);

        saveData();

        renderGrid();

        if(data.rewards[currentNumber]){

            confetti();
        }
    }
});

/* ================= 確認 ================= */

confirmBtn.onclick = ()=>{

    popup.style.display = "none";

    tearing = false;

    ticketTop.classList.remove(
        "opened",
        "tearing"
    );

    ticketTop.style.opacity = 1;

    ticketTop.style.transform =
        "rotate(0deg)";
};

/* ================= 開啟設定 ================= */

function openSetting(){

    const data = pages[currentPage];

    document.getElementById(
        "totalInput"
    ).value = data.total;

    rewardContainer.innerHTML = "";

    Object.keys(data.rewards)
    .forEach(num=>{

        createRewardRow(
            num,
            data.rewards[num]
        );
    });

    /* 顏色同步 */

    document.getElementById(
        "outerColor"
    ).value =
    data.outerColor || "#2f7ea7";

    document.getElementById(
        "innerColor"
    ).value =
    data.innerColor || "#dff3ff";

    settingPage.style.display =
        "block";
}

/* ================= 儲存設定 ================= */

document.getElementById(
    "saveSetting"
).onclick = ()=>{

    const total =
    parseInt(
        document.getElementById(
            "totalInput"
        ).value
    );

    const rewards = {};

    const rows =
    document.querySelectorAll(
        ".rewardRow"
    );

    rows.forEach(row=>{

        const num =
        parseInt(row.children[0].value);

        const text =
        row.children[1].value.trim();

        if(num && text){

            rewards[num] = text;
        }
    });

    /* 顏色 */

    const outerColor =
    document.getElementById(
        "outerColor"
    ).value;

    const innerColor =
    document.getElementById(
        "innerColor"
    ).value;

    pages[currentPage] = {

        total,
        rewards,
        opened:[],

        outerColor,
        innerColor
    };

    /* 套用 */

    document.documentElement.style.setProperty(
        "--outerColor",
        outerColor
    );

    document.documentElement.style.setProperty(
        "--innerColor",
        innerColor
    );

    saveData();

    renderGrid();

    settingPage.style.display =
        "none";
};

/* ================= 格子刷新同步顏色 ================= */

function renderGrid(){

    grid.innerHTML = "";

    const data = pages[currentPage];

    /* 同步顏色 */

    document.documentElement.style.setProperty(
        "--outerColor",
        data.outerColor || "#2f7ea7"
    );

    document.documentElement.style.setProperty(
        "--innerColor",
        data.innerColor || "#dff3ff"
    );

    for(let i=1;i<=data.total;i++){

        const card =
        document.createElement("div");

        card.className = "card";

        if(data.opened.includes(i)){

            card.classList.add("used");
        }

        card.innerText =
        String(i).padStart(3,"0");

        card.onclick = ()=>openTicket(i);

        grid.appendChild(card);
    }
}

</script>
