<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>貓蟲家族 一番賞抽籤</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft JhengHei",sans-serif;
}

body{
    background:linear-gradient(to bottom,#dff7ff,#ffffff);
    overflow:hidden;
    height:100vh;
}

/* ================= UI ================= */
#topInfo{
    position:fixed;
    top:20px;
    right:20px;
    background:rgba(255,255,255,0.85);
    padding:12px 20px;
    border-radius:20px;
    font-size:18px;
    font-weight:bold;
    z-index:999;
}

/* 🔥 設定按鈕（已修正） */
#settingsBtn{
    position:fixed;
    left:20px;
    top:20px;
    padding:10px 15px;
    z-index:9999;
    cursor:pointer;
}

/* ================= 場景 ================= */
#scene{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* ================= 盒子 ================= */
#boxWrap{
    width:360px;
    height:360px;
    position:relative;
    cursor:pointer;
}

#lotteryBox{
    width:100%;
    height:100%;
    background:#76d9ff;
    border-radius:20px;
    box-shadow:0 25px 40px rgba(0,0,0,0.25);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    color:white;
}

/* 抖動 */
.shake{
    animation:shake 0.4s;
}
@keyframes shake{
    0%{transform:rotate(0);}
    25%{transform:rotate(2deg);}
    50%{transform:rotate(-2deg);}
    75%{transform:rotate(2deg);}
    100%{transform:rotate(0);}
}

/* ================= 籤紙 ================= */
#ticket{
    width:240px;
    height:420px;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(0);
    opacity:0;
    z-index:1000;
    transition:0.5s;
}

.ticketShow{
    transform:translate(-50%,-50%) scale(1);
    opacity:1;
    animation:fly 0.6s ease;
}

@keyframes fly{
    0%{transform:translate(-50%,200%) scale(0.2);}
    70%{transform:translate(-50%,-55%) scale(1.05);}
    100%{transform:translate(-50%,-50%) scale(1);}
}

.ticketTop{
    width:100%;
    height:50%;
    background:#fff7d6;
    border:2px dashed #999;
    position:absolute;
    top:0;
    transform-origin:bottom;
    transition:0.6s;
}

.ticketBottom{
    width:100%;
    height:50%;
    background:#fff7d6;
    border:2px dashed #999;
    position:absolute;
    bottom:0;
}

.opened{
    transform:rotateX(-160deg);
}

#resultText{
    text-align:center;
    font-size:40px;
    font-weight:bold;
    color:#ff3b3b;
    opacity:0;
    margin-top:120px;
    transition:0.3s;
}

/* ================= 設定面板 ================= */
#panel{
    position:fixed;
    left:0;
    top:0;
    width:340px;
    height:100vh;
    background:white;
    transform:translateX(-100%);
    transition:0.3s;
    overflow:auto;
    padding:20px;
    z-index:9998;
}

.panelShow{
    transform:translateX(0);
}

.rewardRow{
    display:flex;
    gap:5px;
    margin-bottom:10px;
}

.rewardRow input{
    flex:1;
}

.removeReward{
    width:40px;
    background:red;
    color:white;
    border:none;
    cursor:pointer;
}

.saveBtn{
    width:100%;
    padding:10px;
    margin-top:10px;
}
</style>
</head>

<body>

<button id="settingsBtn">設定</button>

<div id="topInfo">
總數：<span id="totalCount">0</span>
｜剩餘：<span id="remainCount">0</span>
</div>

<div id="scene">

<div id="boxWrap">
    <div id="lotteryBox">貓蟲家族</div>
</div>

<div id="ticket">
    <div class="ticketTop" id="ticketTop"></div>
    <div class="ticketBottom">
        <div id="resultText"></div>
    </div>
</div>

</div>

<!-- ================= 設定 ================= -->
<div id="panel">

<h2>設定</h2>

<div id="rewardContainer"></div>
<button id="addReward">+新增</button>

<button id="saveSetting">儲存</button>
<button id="closePanel">確認返回</button>

</div>

<script>

let tickets=[];
let remainTickets=[];
let drawing=false;
let opened=false;

const box=document.getElementById("lotteryBox");
const boxWrap=document.getElementById("boxWrap");
const ticket=document.getElementById("ticket");
const ticketTop=document.getElementById("ticketTop");
const resultText=document.getElementById("resultText");
const panel=document.getElementById("panel");
const rewardContainer=document.getElementById("rewardContainer");

/* ================= 初始化 ================= */
function init(){
    const data=JSON.parse(localStorage.getItem("lottery")||"null");

    if(data){
        tickets=data.tickets;
        remainTickets=data.remainTickets;
    }else{
        tickets=["A賞","B賞","C賞","銘謝惠顧","銘謝惠顧"];
        remainTickets=[...tickets];
    }

    update();
}
init();

function update(){
    document.getElementById("totalCount").innerText=tickets.length;
    document.getElementById("remainCount").innerText=remainTickets.length;
}

/* ================= 抽獎 ================= */
boxWrap.onclick=()=>{

    if(drawing||remainTickets.length===0)return;

    drawing=true;

    box.classList.add("shake");
    setTimeout(()=>box.classList.remove("shake"),400);

    const idx=Math.floor(Math.random()*remainTickets.length);
    const result=remainTickets.splice(idx,1)[0];

    localStorage.setItem("lottery",JSON.stringify({
        tickets,
        remainTickets
    }));

    update();

    setTimeout(()=>{

        ticket.classList.add("ticketShow");
        resultText.style.opacity=0;
        resultText.innerText=result;

        drawing=false;

    },500);
};

/* ================= 撕開 ================= */
ticketTop.onclick=(e)=>{
    e.stopPropagation();

    if(opened)return;
    opened=true;

    ticketTop.classList.add("opened");

    setTimeout(()=>{
        resultText.style.opacity=1;
    },500);
};

/* ================= 關閉 ================= */
document.body.addEventListener("click",(e)=>{

    if(e.target.closest("#panel")) return;
    if(e.target.closest("#settingsBtn")) return;

    if(!opened)return;

    ticket.classList.remove("ticketShow");
    ticketTop.classList.remove("opened");

    opened=false;
});

/* ================= 🔥 設定按鈕修正版（關鍵修復） ================= */
document.getElementById("settingsBtn")
.addEventListener("click",(e)=>{
    e.stopPropagation();
    panel.classList.toggle("panelShow");
});

/* ================= 新增獎項 ================= */
document.getElementById("addReward").onclick=()=>{

    const row=document.createElement("div");
    row.className="rewardRow";

    row.innerHTML=`
        <input placeholder="文字">
        <input type="number" placeholder="數量">
        <button class="removeReward">-</button>
    `;

    rewardContainer.appendChild(row);
};

/* 刪除獎項 */
document.addEventListener("click",(e)=>{
    if(e.target.classList.contains("removeReward")){
        e.target.parentElement.remove();
    }
});

/* ================= 儲存 ================= */
document.getElementById("saveSetting").onclick=()=>{

    let newTickets=[];

    document.querySelectorAll(".rewardRow").forEach(r=>{
        const text=r.children[0].value;
        const count=parseInt(r.children[1].value||0);

        for(let i=0;i<count;i++){
            newTickets.push(text);
        }
    });

    tickets=[...newTickets];
    remainTickets=[...newTickets];

    localStorage.setItem("lottery",JSON.stringify({
        tickets,
        remainTickets
    }));

    update();
    alert("已儲存");
};

/* ================= 關閉設定 ================= */
document.getElementById("closePanel").onclick=()=>{
    panel.classList.remove("panelShow");
};

</script>

</body>
</html>
